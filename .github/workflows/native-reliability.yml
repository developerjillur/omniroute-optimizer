name: Native reliability

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: test
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      MITM_AUTO_RECOVER: "false"
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
      OMNIROUTE_SKIP_DNS_WRITE: "1"
      ADOBE_FIREFLY_BROWSER_REFRESH: "0"
      APP_LOG_TO_FILE: "false"
      OMNIROUTE_SSE_COMMENTS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      - name: Check overlay tooling
        run: node --test --test-concurrency=1 nexa/tests/*.test.mjs nexa/deploy/tsc-ratchet.test.mjs
      - name: Prepare the pinned pristine application
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/omniroute-fixture"
          git init "$fixture"
          git -C "$fixture" remote add upstream https://github.com/diegosouzapw/OmniRoute.git
          git -C "$fixture" fetch --depth=1 upstream c1e30b7676975feb298b49eff6ff58923c04b89e
          git -C "$fixture" checkout --detach FETCH_HEAD
          git -C "$fixture" branch upstream-main HEAD
          test ! -e "$fixture/nexa"
          cp -R "$GITHUB_WORKSPACE/nexa" "$fixture/nexa"
          cd "$fixture"
          node nexa/check/pristine-base.mjs
          node nexa/apply.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 --foreground-scripts
          node "$fixture/node_modules/prettier/bin/prettier.cjs" --write --print-width 100 --trailing-comma es5 "$GITHUB_WORKSPACE/nexa/deploy/bridge-upstream-dns.cjs" "$GITHUB_WORKSPACE/nexa/tests/bridge-upstream-dns.test.mjs" "$GITHUB_WORKSPACE/nexa/tests/overlay-base-version.test.mjs" "$GITHUB_WORKSPACE/nexa/tests/verify-baseline-red.mjs" "$GITHUB_WORKSPACE/nexa/new/tests/unit/native-claude-refusal-terminal.test.ts" "$GITHUB_WORKSPACE/nexa/new/tests/unit/native-thread-error-classification.test.ts" "$GITHUB_WORKSPACE/nexa/new/tests/unit/native-stream-summary.test.ts" "$GITHUB_WORKSPACE/.github/workflows/native-reliability.yml" "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/reports/native-reliability-2026-10-28.json"
          git -C "$GITHUB_WORKSPACE" diff --binary > "$RUNNER_TEMP/formatting.patch"
          cp -R "$GITHUB_WORKSPACE/nexa/." "$fixture/nexa/"
          node nexa/gen-manifest.mjs
          cmp nexa/manifest.json "$GITHUB_WORKSPACE/nexa/manifest.json"
          node nexa/apply.mjs
      - name: Reproduce the original native terminal and Thread classification failures
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/omniroute-fixture"
          export DATA_DIR="$RUNNER_TEMP/native-baseline-data"
          export TMPDIR="$RUNNER_TEMP"
          git apply --reverse nexa/tests/fixtures/native-refusal-delta.patch
          set +e
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --import ./nexa/tests/isolated-network.mjs --test --test-reporter=tap --test-concurrency=1 --test-force-exit tests/unit/native-claude-refusal-terminal.test.ts tests/unit/native-thread-error-classification.test.ts tests/unit/native-stream-summary.test.ts > "$RUNNER_TEMP/native-red.tap" 2>&1
          result=$?
          set -e
          tail -n 70 "$RUNNER_TEMP/native-red.tap"
          test "$result" -ne 0
          node "$GITHUB_WORKSPACE/nexa/tests/verify-baseline-red.mjs" "$RUNNER_TEMP/native-red.tap"
          git apply nexa/tests/fixtures/native-refusal-delta.patch
      - name: Native, protocol, transport, cache and translator regressions
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/omniroute-fixture"
          export DATA_DIR="$RUNNER_TEMP/native-green-data"
          export TMPDIR="$RUNNER_TEMP"
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --import ./nexa/tests/isolated-network.mjs --test --test-reporter=tap --test-concurrency=1 --test-force-exit tests/unit/native-claude-refusal-terminal.test.ts tests/unit/native-thread-error-classification.test.ts tests/unit/native-stream-summary.test.ts tests/unit/native-artifact-recovery.test.ts tests/unit/native-usage-fidelity.test.ts tests/unit/native-claude-thread-protocol.test.ts tests/unit/native-claude-thread-executor.test.ts tests/unit/native-claude-thread-chatcore.test.ts tests/unit/native-claude-thread-routing.test.ts tests/unit/agent-bridge-native-transport.test.ts tests/unit/agent-bridge-native-cache-continuity.test.ts tests/unit/agent-bridge-thread-cache.test.ts tests/unit/native-thinking-signature-switch.test.ts tests/unit/native-suggestion-empty-response.test.ts tests/unit/native-context-overflow-error.test.ts tests/unit/cache-ttl-stream.test.ts tests/unit/cache-ttl-extraction.test.ts tests/unit/translator-resp-claude-to-openai.test.ts | tee "$RUNNER_TEMP/native-green.tap"
      - name: Remaining native cache, usage and transport regressions
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/omniroute-fixture"
          export DATA_DIR="$RUNNER_TEMP/native-extended-data"
          export TMPDIR="$RUNNER_TEMP"
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --import ./nexa/tests/isolated-network.mjs --test --test-reporter=tap --test-concurrency=1 --test-force-exit tests/unit/agent-bridge-native-buffered.test.ts tests/unit/agent-bridge-quota-recovery.test.ts tests/unit/cache-ttl-metering.test.ts tests/unit/cache-ttl-pricing-api.test.ts tests/unit/cache-ttl-tool-loop.test.ts tests/unit/claude-usage-effort.test.ts tests/unit/cli-package-migrations.test.mjs tests/unit/db/cache-ttl-analytics-route.test.ts tests/unit/db/cache-ttl-archive.test.ts tests/unit/db/cache-ttl-forecast.test.ts tests/unit/db/cache-ttl-history-analytics.test.ts tests/unit/db/native-claude-usage-persistence.test.ts tests/unit/db/pricing-provider-alias-defaults.test.ts tests/unit/gpt-6-1-sol-pricing-analytics.test.ts tests/unit/gpt-6-1-sol-pricing.test.ts tests/unit/haiku-5-5-native-effort.test.ts tests/unit/inference-transport-no-replay.test.ts tests/unit/native-cache-health.test.ts tests/unit/native-claude-cache-identity.test.ts tests/unit/prompt-cache-ttl-cost.test.ts tests/unit/provider-models-config.test.ts tests/unit/reasoning-cost-double-billing.test.ts tests/unit/server-owned-tool-loop.test.ts tests/unit/ui/native-cache-panel.test.ts tests/unit/xai-exact-cost-2453.test.ts | tee "$RUNNER_TEMP/native-extended.tap"
      - name: Existing stream, empty-content and diagnostic regressions
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/omniroute-fixture"
          export DATA_DIR="$RUNNER_TEMP/stream-green-data"
          export TMPDIR="$RUNNER_TEMP"
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --import ./nexa/tests/isolated-network.mjs --test --test-reporter=tap --test-concurrency=1 --test-force-exit tests/unit/14160-antigravity-empty-stop-completion.test.ts tests/unit/claude-empty-stream-error-3685.test.ts tests/unit/codex-tool-handoff-disconnect-499.test.ts tests/unit/combo-empty-content-failover-5085.test.ts tests/unit/compression/memory-mitigations-edge-cases.test.ts tests/unit/db-detailed-logs.test.ts tests/unit/empty-content-stopreason-3572.test.ts tests/unit/empty-stream-no-content-8649.test.ts tests/unit/error-classifier.test.ts tests/unit/issue-6623-opencode-mimo-reasoning-details-nonstream.test.ts tests/unit/reasoning-probe-truncated-response-10281.test.ts tests/unit/request-log-payloads.test.ts tests/unit/responses-continuation-client-payload-survives-cap-truncation.test.ts tests/unit/responses-continuation-passthrough-client-payload.test.ts tests/unit/responses-continuation-store.test.ts tests/unit/services-branch-hardening.test.ts tests/unit/silent-sse-close-7699.test.ts tests/unit/silent-sse-close-openai-10443.test.ts tests/unit/silent-sse-close-responses-no-terminal.test.ts tests/unit/stream-claude-delta-contract.test.ts tests/unit/stream-handler.test.ts tests/unit/stream-payload-collector-9315-truncated-provider-response.test.ts tests/unit/stream-payload-collector-cap.test.ts tests/unit/stream-payload-collector.test.ts tests/unit/stream-readiness-policy.test.ts tests/unit/stream-readiness.test.ts tests/unit/stream-utilities.test.ts tests/unit/stream-utils.test.ts | tee "$RUNNER_TEMP/stream-green.tap"
      - name: Core typecheck
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: npm run typecheck:core
      - name: Full-project TypeScript ratchet
        timeout-minutes: 8
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXA_TSC_DIAGNOSTICS: ${{ runner.temp }}/tsc-diagnostics.log
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: node scripts/check/check-tsc-ratchet.mjs --ratchet
      - name: Full lint
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: npm run lint
      - name: Documentation gates
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: npm run check:docs-all
      - name: Select the installed production Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Production Node native and DNS regressions
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 nexa/tests/*.test.mjs nexa/deploy/tsc-ratchet.test.mjs
          cd "$RUNNER_TEMP/omniroute-fixture"
          export DATA_DIR="$RUNNER_TEMP/native-production-data"
          export TMPDIR="$RUNNER_TEMP"
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --import ./nexa/tests/isolated-network.mjs --test --test-reporter=tap --test-concurrency=1 --test-force-exit tests/unit/native-claude-refusal-terminal.test.ts tests/unit/native-thread-error-classification.test.ts tests/unit/native-stream-summary.test.ts tests/unit/native-artifact-recovery.test.ts tests/unit/native-usage-fidelity.test.ts tests/unit/native-claude-thread-protocol.test.ts tests/unit/native-claude-thread-executor.test.ts tests/unit/native-claude-thread-chatcore.test.ts tests/unit/native-claude-thread-routing.test.ts tests/unit/agent-bridge-native-transport.test.ts tests/unit/agent-bridge-native-cache-continuity.test.ts tests/unit/agent-bridge-thread-cache.test.ts tests/unit/native-thinking-signature-switch.test.ts tests/unit/native-suggestion-empty-response.test.ts tests/unit/native-context-overflow-error.test.ts tests/unit/cache-ttl-stream.test.ts tests/unit/cache-ttl-extraction.test.ts tests/unit/translator-resp-claude-to-openai.test.ts | tee "$RUNNER_TEMP/native-production.tap"
      - name: Require committed formatting
        run: test ! -s "$RUNNER_TEMP/formatting.patch"
      - name: Preserve reviewable formatter changes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatting-changes
          path: ${{ runner.temp }}/formatting.patch
      - name: Preserve synthetic regression output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-output
          path: |
            ${{ runner.temp }}/native-red.tap
            ${{ runner.temp }}/native-green.tap
            ${{ runner.temp }}/native-extended.tap
            ${{ runner.temp }}/stream-green.tap
            ${{ runner.temp }}/native-production.tap
            ${{ runner.temp }}/tsc-diagnostics.log
