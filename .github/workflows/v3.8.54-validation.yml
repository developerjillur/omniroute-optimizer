name: v3.8.54 release compatibility

on:
  workflow_dispatch:
  push:
    branches: [fix/v3.8.54-models]
    paths:
      - .github/workflows/v3.8.54-validation.yml
      - nexa/patches/package-lock.json.patch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: test
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      MITM_AUTO_RECOVER: "false"
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
      OMNIROUTE_SKIP_DNS_WRITE: "1"
      ADOBE_FIREFLY_BROWSER_REFRESH: "0"
      APP_LOG_TO_FILE: "false"
      OMNIROUTE_SSE_COMMENTS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      - name: Verify canonical source inventory
        run: node nexa/tests/verify-source-inventory.mjs
      - name: Prepare pristine release and baseline compiler dependencies
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/omniroute-fixture"
          git init "$fixture"
          git -C "$fixture" remote add upstream https://github.com/cheaper-inference/OmniRoute.git
          git -C "$fixture" fetch --depth=1 upstream 1c880c5c95b3f0240d5e4c6c8f0947ec46b5d25e
          git -C "$fixture" checkout --detach FETCH_HEAD
          git -C "$fixture" branch upstream-main HEAD
          previousFixture="$RUNNER_TEMP/upstream-3.8.51-schema"
          mkdir "$previousFixture"
          git -C "$fixture" fetch --depth=1 upstream c1e30b7676975feb298b49eff6ff58923c04b89e
          git -C "$fixture" archive c1e30b7676975feb298b49eff6ff58923c04b89e src/lib/db/migrations src/lib/db/core.ts src/lib/db/schemaColumns.ts | tar -x -C "$previousFixture"
          echo "NEXA_PREVIOUS_MIGRATIONS_DIR=$previousFixture/src/lib/db/migrations" >> "$GITHUB_ENV"
          previous52="$RUNNER_TEMP/upstream-3.8.52-schema"
          mkdir "$previous52"
          git -C "$fixture" fetch --depth=1 upstream ad6f33f66bda34eba98645d3bfdabbde294bc843
          git -C "$fixture" archive ad6f33f66bda34eba98645d3bfdabbde294bc843 src/lib/db/migrations src/lib/db/core.ts src/lib/db/schemaColumns.ts | tar -x -C "$previous52"
          echo "NEXA_PREVIOUS_MIGRATIONS_V52_DIR=$previous52/src/lib/db/migrations" >> "$GITHUB_ENV"
          cp -R nexa "$fixture/nexa"
          cd "$fixture"
          node nexa/check/pristine-base.mjs
          node nexa/apply.mjs --check
          node nexa/gen-manifest.mjs
          cmp nexa/manifest.json "$GITHUB_WORKSPACE/nexa/manifest.json"
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 --foreground-scripts
          npx --no-install fumadocs-mdx
      - name: Measure completed pristine compiler diagnostics
        id: pristine_types
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: node nexa/tests/capture-pristine-types.mjs
      - name: Apply only the reviewed overlay and locked dependencies
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: |
          set -euo pipefail
          node nexa/apply.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          node bin/cli/utils/dependencySecurity.mjs --apply
          npm rebuild better-sqlite3 --foreground-scripts
          npx --no-install fumadocs-mdx
          echo "DATA_DIR=$RUNNER_TEMP/model-release-validation-data" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/validation-tmp" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/model-release-validation-data" "$RUNNER_TEMP/validation-tmp"
      - name: Parse every applied source module
        id: syntax
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: node nexa/tests/check-applied-syntax.mjs
      - name: Reproduce port regressions on pristine upstream helpers
        id: baseline_red
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: node nexa/tests/verify-v354-red.mjs
      - name: Verify new port regressions with corrected helpers
        id: focused_green
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: |
          set -euo pipefail
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --import ./nexa/tests/isolated-network.mjs --test --test-reporter=tap --test-concurrency=1 tests/unit/nexa-v354-compatibility.test.ts | tee "$RUNNER_TEMP/v354-focused-green.tap"
      - name: Preserve native, quota, migration, pricing and translation regressions
        id: compatibility
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: |
          set -euo pipefail
          node nexa/tests/run-upgrade-compatibility.mjs | tee "$RUNNER_TEMP/v354-compatibility.tap"
      - name: Agent Bridge and dashboard interface regressions
        id: bridge
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --import ./nexa/tests/isolated-network.mjs
        run: |
          set -euo pipefail
          node nexa/deploy/run-bridge-tests.mjs | tee "$RUNNER_TEMP/v354-bridge.tap"
      - name: Verify frontier model metadata helpers
        id: model_helpers
        continue-on-error: true
        run: node --test --test-concurrency=1 nexa/tests/frontier-model-catalog.test.mjs
      - name: Core typecheck
        id: core
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: npm run typecheck:core
      - name: Measure full candidate diagnostics without raising the accepted ceiling
        id: full_types
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/check/check-tsc-ratchet.mjs --ratchet --diagnostics-out "$RUNNER_TEMP/tsc-diagnostics.log"
      - name: Reject any newly introduced diagnostic identity
        id: compare_types
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: node nexa/tests/compare-upgrade-types.mjs
      - name: Full lint
        id: lint
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: npm run lint
      - name: Required documentation checks
        id: docs
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: npm run check:docs-all
      - name: Audit actual installed production dependencies
        id: security
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/v354-production-audit.json"
          audit_exit=$?
          set -e
          if [ "$audit_exit" -gt 1 ]; then exit "$audit_exit"; fi
          node bin/cli/utils/dependencySecurity.mjs --audit "$RUNNER_TEMP/v354-production-audit.json" | tee "$RUNNER_TEMP/v354-security-remediation.json"
      - name: Select production Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Rebuild the isolated database driver for production Node
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: npm rebuild better-sqlite3 --foreground-scripts
      - name: Production-runtime native and frontier-model regressions
        id: production_native
        continue-on-error: true
        working-directory: ${{ runner.temp }}/omniroute-fixture
        run: |
          set -euo pipefail
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --import ./nexa/tests/isolated-network.mjs --test --test-reporter=tap --test-concurrency=1 tests/unit/nexa-v354-compatibility.test.ts tests/unit/nexa-v354-metering.test.ts tests/unit/frontier-model-release.test.ts tests/unit/dashboard-live-model-release.test.ts tests/unit/claude-fable-5-2.test.ts tests/unit/native-claude-thread-executor.test.ts tests/unit/native-claude-thread-chatcore.test.ts tests/unit/native-thinking-signature-switch.test.ts tests/unit/native-usage-fidelity.test.ts tests/unit/inference-transport-no-replay.test.ts | tee "$RUNNER_TEMP/v354-production-native.tap"
      - name: Require every release gate
        if: always()
        env:
          GATE_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          outcomes=json.loads(os.environ['GATE_OUTCOMES'])
          required=['pristine_types','syntax','baseline_red','focused_green','compatibility','bridge','model_helpers','core','full_types','compare_types','lint','docs','security','production_native']
          failed={name:outcomes.get(name,{}).get('outcome','missing') for name in required if outcomes.get(name,{}).get('outcome')!='success'}
          receipt={'sourceCommit':os.environ['GITHUB_SHA'],'status':'PASS' if not failed else 'NOT_ACCEPTED','failedGates':failed,'productionBuildExecuted':False,'liveChanged':False}
          (Path(os.environ['RUNNER_TEMP'])/'v354-validation.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          assert not failed, 'Every release gate must pass'
          PY
      - name: Preserve exact validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3.8.54-validation
          path: |
            ${{ runner.temp }}/v354-*.tap
            ${{ runner.temp }}/v354-*.json
            ${{ runner.temp }}/pristine-tsc-diagnostics.log
            ${{ runner.temp }}/pristine-tsc-identities.json
            ${{ runner.temp }}/tsc-diagnostics.log
            ${{ runner.temp }}/upgrade-types.json
